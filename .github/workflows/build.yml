# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: Set Release/Debug name
        id: build_name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "type=Debug" >> $GITHUB_OUTPUT
          else
            echo "type=Release" >> $GITHUB_OUTPUT
          fi
      - name: zip artifacts
        if: ${{ matrix.java == '21' }}
        run: |
          mkdir -p build/zip
          zip -j build/zip/VulkanMobile.zip build/libs/*.jar

      - name: capture build artifacts
        if: ${{ matrix.java == '21' }} # Only upload artifacts built from latest java
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan Mobile - ${{ steps.build_name.outputs.type }}
          path: build/zip/VulkanMobile.zip
          retention-days: 30

      - name: Upload to Release (if tagged)
        if: ${{ matrix.java == '21' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: build/zip/VulkanMobile.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}